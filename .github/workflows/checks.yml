name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, build and public-safety checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Public-safety checks
        run: npm run check:public

      - name: Portal bridge tests (Node)
        run: npm run test:bridge
        env:
          BRIDGE_NODE_ONLY: "1"
